name: Keep Render Service Alive

on:
  schedule:
    # Har 10 minute mein automatically request bhejega
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-service:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl -s https://resale-radar.onrender.com/api/health
